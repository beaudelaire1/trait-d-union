name: P0 audit validation

on:
  pull_request:
    branches: [deploy/coolify-ovh]
  push:
    branches: [fix/p0-audit-2026-08-21]

env:
  PYTHON_VERSION: "3.12"

jobs:
  p0-regression:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tus_test
          POSTGRES_USER: tus_test
          POSTGRES_PASSWORD: tus_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-p0-secret-key-not-for-production-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://tus_test:tus_test_ci@localhost:5432/tus_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install ruff bandit

      - name: Strict Ruff on P0 Python files
        run: |
          ruff check \
            apps/devis/public_views.py \
            apps/devis/urls.py \
            apps/factures/public_views.py \
            apps/factures/urls.py \
            apps/pages/p0_views.py \
            apps/pages/urls.py \
            apps/simulateur/p0_views.py \
            apps/simulateur/report_content_overrides.py \
            apps/simulateur/services.py \
            apps/simulateur/urls.py \
            tests/test_p0_audit_fixes.py \
            --output-format=github

      - name: Bandit on P0 Python files
        run: |
          bandit -q -lll \
            apps/devis/public_views.py \
            apps/factures/public_views.py \
            apps/pages/p0_views.py \
            apps/simulateur/p0_views.py \
            apps/simulateur/report_content_overrides.py \
            apps/simulateur/services.py

      - name: Django system check
        run: python manage.py check

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: P0 regression tests
        run: pytest tests/test_p0_audit_fixes.py -q --tb=short
