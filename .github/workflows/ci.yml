name: CI — Trait d'Union Studio

on:
  push:
    branches: [main, develop, deploy/coolify-ovh]
  pull_request:
    branches: [main, deploy/coolify-ovh]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. Blocking quality + security gate
  # ──────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install quality tools
        run: python -m pip install ruff==0.16.4 bandit==1.9.4

      - name: Ruff correctness gate
        run: >-
          ruff check
          apps/ config/ core/ services/ tests/ manage.py
          --output-format=github

      - name: Bandit security gate
        run: bandit -q -r apps/ core/ config/ -ll -c bandit.yaml

  # ──────────────────────────────────────────────────────────────
  # 2. Tests with PostgreSQL + Coverage
  # ──────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-24.04
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tus_test
          POSTGRES_USER: tus_test
          POSTGRES_PASSWORD: tus_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tus_test -d tus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://tus_test:tus_test_ci@localhost:5432/tus_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system dependencies (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libgdk-pixbuf2.0-0 libffi-dev shared-mime-info \
            fonts-liberation fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Django system checks
        run: python manage.py check

      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        run: |
          pytest --tb=short -q \
            --cov=apps --cov=core --cov=config \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=57.5

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
