target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/*.py"]

[lint]
# Repository-wide blocking baseline: syntax/control-flow errors and unresolved
# names. Broader style cleanup is a separate refactor and must not be hidden by
# a permissive CI exit code.
select = ["E4", "E7", "E9", "F63", "F7", "F82"]

[lint.per-file-ignores]
# The generator deliberately keeps Invoice as a forward reference to avoid a
# model/service import cycle; postponed annotations make it runtime-safe.
"apps/factures/services/pdf_generator.py" = ["F821"]
