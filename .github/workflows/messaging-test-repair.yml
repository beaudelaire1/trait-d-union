name: One-time messaging test repair

on:
  pull_request:
    branches:
      - deploy/coolify-ovh

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.repository == 'beaudelaire1/trait-d-union' &&
      github.event.pull_request.head.ref == 'fix/p0-audit-2026-08-21' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/p0-audit-2026-08-21

      - name: Repair stale messaging mocks
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_messaging_views.py')
          text = path.read_text(encoding='utf-8')

          old_1 = '''    @patch('apps.messaging.views.send_prospect_email', return_value=True)\n    def test_send_email_to_prospect(self, mock_send, client, staff_user, prospect):\n        client.force_login(staff_user)\n        response = client.post(f'/tus-gestion-secure/messaging/prospects/{prospect.pk}/send/', {\n            'subject': 'Test Email',\n            'body_html': 'Hello!',\n        })\n        assert response.status_code in (200, 302)\n'''
          new_1 = '''    @patch('apps.messaging.views.send_prospection_template', return_value={'success': True})\n    def test_send_email_to_prospect(self, mock_send, client, staff_user, prospect):\n        client.force_login(staff_user)\n        response = client.post(\n            f'/tus-gestion-secure/messaging/prospects/{prospect.pk}/send/',\n            {'template': 'prospection-standard'},\n        )\n        assert response.status_code == 302\n        mock_send.assert_called_once_with(prospect, 'prospection-standard')\n'''

          old_2 = '''    @patch('apps.messaging.views.send_prospect_email', return_value=True)\n    def test_send_email_api_post(self, mock_send, client, staff_user):\n        client.force_login(staff_user)\n        response = client.post(\n            '/tus-gestion-secure/messaging/api/send/',\n            json.dumps({\n                'to': 'test@example.com',\n                'subject': 'Test',\n                'body': '<p>Hello</p>',\n            }),\n            content_type='application/json',\n        )\n        assert response.status_code in (200, 400)\n'''
          new_2 = '''    @patch(\n        'apps.messaging.services.send_email_brevo',\n        return_value={'success': True, 'message_id': 'test-message-id'},\n    )\n    def test_send_email_api_post(self, mock_send, client, staff_user):\n        client.force_login(staff_user)\n        response = client.post(\n            '/tus-gestion-secure/messaging/api/send/',\n            json.dumps({\n                'recipients': ['test@example.com'],\n                'subject': 'Test',\n                'content': '<p>Hello</p>',\n            }),\n            content_type='application/json',\n        )\n        assert response.status_code == 200\n        assert response.json()['sent'] == 1\n        mock_send.assert_called_once_with(\n            to_email='test@example.com',\n            subject='Test',\n            html_content='<p>Hello</p>',\n        )\n'''

          for label, old, new in [('prospect send test', old_1, new_1), ('send API test', old_2, new_2)]:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate repaired tests
        run: |
          python -m pip install -r requirements-dev.txt
          ruff check tests/test_messaging_views.py apps/messaging/views.py apps/messaging/services.py
          pytest -q \
            tests/test_messaging_views.py::TestMessagingSendEmail::test_send_email_to_prospect \
            tests/test_messaging_views.py::TestSendEmailAPI::test_send_email_api_post
          git diff --check

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_messaging_views.py
          git commit -m 'test: patch messaging dependencies actually used'
          git push origin HEAD:fix/p0-audit-2026-08-21
