name: One-time Ruff safe cleanup

on:
  push:
    branches:
      - fix/p0-audit-2026-08-21

permissions:
  contents: write

jobs:
  safe-fix:
    if: >-
      github.repository == 'beaudelaire1/trait-d-union' &&
      github.ref == 'refs/heads/fix/p0-audit-2026-08-21' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/p0-audit-2026-08-21

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pinned Ruff
        run: python -m pip install ruff==0.16.4

      - name: Apply Ruff safe fixes only
        run: |
          ruff check apps/ config/ core/ services/ tests/ manage.py --fix --exit-zero
          git diff --check

      - name: Commit safe fixes
        run: |
          if git diff --quiet; then
            echo 'No safe Ruff fixes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps config core services tests manage.py
          git commit -m 'chore: apply Ruff safe fixes'
          git push origin HEAD:fix/p0-audit-2026-08-21
