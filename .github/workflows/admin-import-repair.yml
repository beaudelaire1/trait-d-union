name: One-time admin import repair

on:
  pull_request:
    branches:
      - deploy/coolify-ovh

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.repository == 'beaudelaire1/trait-d-union' &&
      github.event.pull_request.head.ref == 'fix/p0-audit-2026-08-21' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/p0-audit-2026-08-21

      - name: Repair workflow model imports
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/clients/admin.py')
          text = path.read_text(encoding='utf-8')
          old = """from .models import (\n    ClientProfile, Project, ProjectMilestone, ClientDocument,\n    ProjectActivity, ProjectComment, ClientNotification,\n    WorkflowTemplate, MilestoneTemplate\n)\n"""
          new = """from .models import (\n    ClientProfile, Project, ProjectMilestone, ClientDocument,\n    ProjectActivity, ProjectComment, ClientNotification,\n)\nfrom .models_workflow import WorkflowTemplate, MilestoneTemplate\n"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one admin import block, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate repair
        run: |
          python -m pip install -r requirements-dev.txt
          ruff check apps/clients/admin.py apps/clients/models.py apps/clients/models_workflow.py
          python manage.py check
          git diff --check

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/clients/admin.py
          git commit -m 'fix: import workflow models from their module'
          git push origin HEAD:fix/p0-audit-2026-08-21
