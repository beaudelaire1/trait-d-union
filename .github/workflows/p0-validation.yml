name: P0 Audit Validation

on:
  push:
    branches:
      - fix/p0-audit-2026-08-21

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  DJANGO_SETTINGS_MODULE: config.settings.test
  DATABASE_URL: postgres://tus_test:tus_test_ci@localhost:5432/tus_test
  REDIS_URL: redis://localhost:6379/0

jobs:
  validate-p0:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tus_test
          POSTGRES_USER: tus_test
          POSTGRES_PASSWORD: tus_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libgdk-pixbuf2.0-0 libffi-dev shared-mime-info \
            fonts-liberation fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            apps/pages/p0_views.py \
            apps/devis/public_views.py \
            apps/factures/public_views.py \
            apps/simulateur/p0_views.py \
            apps/simulateur/report_content_overrides.py

      - name: Django system checks
        run: python manage.py check

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Ruff on P0 Python changes
        run: |
          ruff check \
            apps/pages/p0_views.py \
            apps/devis/public_views.py \
            apps/factures/public_views.py \
            apps/simulateur/p0_views.py \
            apps/simulateur/report_content_overrides.py \
            tests/test_p0_audit_fixes.py

      - name: P0 regression tests
        run: pytest --tb=short -q tests/test_p0_audit_fixes.py tests/test_simulateur_report.py
